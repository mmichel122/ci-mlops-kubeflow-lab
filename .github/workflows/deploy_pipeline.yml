name: Build and Deploy AnimeOps

on:
  push:
    branches: ["main"]
    paths:
      - "components/training/**"
      - "components/serving/**"
      - "src/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"

concurrency:
  group: animeops-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted

    env:
      DOCKERHUB_REPO_APP: mmdocker06/anime-ops-app
      DOCKERHUB_REPO_TRAIN: mmdocker06/anime-ops-training

      # KFP API endpoint (NOT the UI)
      KFP_HOST: http://10.200.1.76:30081

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push serving image
        uses: docker/build-push-action@v6
        with:
          context: ./components/serving
          file: ./components/serving/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO_APP }}:latest
            ${{ env.DOCKERHUB_REPO_APP }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push training image
        uses: docker/build-push-action@v6
        with:
          context: ./components/training
          file: ./components/training/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO_TRAIN }}:latest
            ${{ env.DOCKERHUB_REPO_TRAIN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check KFP API reachable
        run: |
          curl -sS -m 5 "$KFP_HOST/apis/v1beta1/healthz" || (echo "KFP API not reachable at $KFP_HOST" && exit 1)

      - name: Compile & deploy pipeline
        env:
          TRAINING_IMAGE: ${{ env.DOCKERHUB_REPO_TRAIN }}:${{ github.sha }}
          SERVING_IMAGE:  ${{ env.DOCKERHUB_REPO_APP }}:${{ github.sha }}
          # set to "1" if you want a run each push (only works if deploy.py supports it)
          CREATE_RUN: "1"
        run: |
          export KUBEFLOW_HOST="${KFP_HOST}"
          python scripts/deploy.py
