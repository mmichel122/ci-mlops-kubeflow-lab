name: Build and Deploy Anime Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'k3s-ops/anime-training/**'
      - 'src/pipeline.py'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: anime-ops
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG k3s-ops/anime-training
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Deploy Pipeline to Kubeflow
      run: |
        pip install kfp
        python scripts/deploy.py
      env:
        # If your K3s cluster is accessible from the internet (e.g. via LoadBalancer)
        # If running locally, you might need a self-hosted runner.
        KUBEFLOW_HOST: ${{ secrets.KUBEFLOW_HOST }}