name: Build and Deploy Anime Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'components/training/**'
      - 'src/pipeline.py'
      - '.github/workflows/**'

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-3

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: anime-ops
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG components/training
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Deploy Pipeline to Kubeflow
      run: |
        # Create a virtual environment named 'venv'
        python3 -m venv venv
        
        # Activate it and install
        source venv/bin/activate
        pip install kfp
        
        # Run your script INSIDE the virtual environment with new local url
        python scripts/deploy.py
      env:
        # If your K3s cluster is accessible from the internet (e.g. via LoadBalancer)
        # If running locally, you might need a self-hosted runner.
        KUBEFLOW_HOST: ${{ secrets.KUBE_CONFIG}}