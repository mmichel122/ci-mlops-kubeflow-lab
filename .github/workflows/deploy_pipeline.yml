name: Deploy Housing Pipeline
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'requirements.txt'

jobs:
  build-and-run:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Virtual Environment & Install Dependencies
        run: |
          # 1. Create a virtual environment named 'venv'
          python3 -m venv venv
          
          # 2. Upgrade pip inside the venv
          venv/bin/pip install --upgrade pip
          
          # 3. Install requirements inside the venv
          venv/bin/pip install -r requirements.txt

      - name: Compile and Run Pipeline
        env:
          KFP_HOST: "http://localhost:8080"
        run: |
          echo "🚀 Compiling and Submitting Pipeline..."
          
          # 4. Run the script using the venv's python
          venv/bin/python src/housing_pipeline.py
          
          echo "✅ Pipeline Submitted to Local Cluster!"