apiVersion: v1
kind: Namespace
metadata:
  name: argo-events
---
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: argo-events
spec:
  jetstream:
    version: latest
---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: sqs-webhook-source
  namespace: argo-events
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    s3csv:
      port: "12000"
      endpoint: /s3csv
      method: POST
      jsonBody: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-events-sa
  namespace: argo-events
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sensor-basic
  namespace: argo-events
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["sensors", "eventsources"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sensor-basic-binding
  namespace: argo-events
subjects:
  - kind: ServiceAccount
    name: argo-events-sa
    namespace: argo-events
roleRef:
  kind: Role
  name: sensor-basic
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-job-create
  namespace: kubeflow
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allow-job-create-binding
  namespace: kubeflow
subjects:
  - kind: ServiceAccount
    name: argo-events-sa
    namespace: argo-events
roleRef:
  kind: Role
  name: allow-job-create
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sqs-poller-code
  namespace: argo-events
data:
  poller.py: |
    import json, os, requests
    import boto3

    REGION = os.getenv("AWS_REGION", "eu-west-3")
    QUEUE_URL = os.environ["SQS_QUEUE_URL"]
    WEBHOOK_URL = os.environ["WEBHOOK_URL"]

    sqs = boto3.client("sqs", region_name=REGION)

    while True:
      resp = sqs.receive_message(
        QueueUrl=QUEUE_URL,
        MaxNumberOfMessages=10,
        WaitTimeSeconds=20,
        VisibilityTimeout=300,
      )
      for m in resp.get("Messages", []):
        rh = m["ReceiptHandle"]
        body = json.loads(m["Body"])

        if body.get("Event") == "s3:TestEvent":
          sqs.delete_message(QueueUrl=QUEUE_URL, ReceiptHandle=rh)
          continue

        r = requests.post(WEBHOOK_URL, json=body, timeout=10)
        r.raise_for_status()

        sqs.delete_message(QueueUrl=QUEUE_URL, ReceiptHandle=rh)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqs-poller
  namespace: argo-events
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqs-poller
  template:
    metadata:
      labels:
        app: sqs-poller
    spec:
      containers:
        - name: poller
          image: python:3.11-slim
          command: ["/bin/sh","-lc"]
          args:
            - pip install --no-cache-dir boto3 requests && python /app/poller.py
          env:
            - name: AWS_REGION
              value: eu-west-3
            - name: SQS_QUEUE_URL
              value: "https://sqs.eu-west-3.amazonaws.com/548894310305/kubeflow-pipeline-trigger-queue"
            - name: WEBHOOK_URL
              value: "http://sqs-webhook-source-eventsource-svc.argo-events.svc.cluster.local:12000/s3csv"
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: sqs-poller-code
